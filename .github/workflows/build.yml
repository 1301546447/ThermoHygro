name: Windows build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ThermoHygro.sln -c Release
      - name: Protocol, multi-sensor, storage, reporting and backup verification
        run: dotnet run --project tests/ThermoHygro.Tests -c Release --no-build
      - name: Package standalone Windows tool
        shell: pwsh
        run: ./scripts/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ThermoHygro-win-x64
          path: publish/*.zip
